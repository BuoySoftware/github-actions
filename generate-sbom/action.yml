name: Generate SBOM
description: |
  Generates an SPDX SBOM with Syft and optionally uploads it to a GitHub
  Release or as a workflow artifact.

  Mirrors generate-structure-sql: the generator and the upload live together,
  so a run that names its tag explicitly attaches to that tag's release. The
  underlying sbom-action uploads to a release only on a push to a tags ref,
  which left the workflow_dispatch recovery path with a workflow artifact and
  no release asset while still reporting success.

  Prerequisites (caller must provide):
  - actions/checkout
  - installed dependencies, when the SBOM has to carry licenses. Syft reads
    names and versions from lock files, but licenses only from installed
    package metadata, so scanning a bare checkout reports NOASSERTION for
    every component. Installing first can pull dependencies of dependencies
    into the checkout; see the exclude input.
  - python3 on PATH for the release step, which talks to the REST API
    directly. The gh CLI is deliberately not used: GitHub-hosted runners
    preinstall it and self-hosted images do not necessarily carry it.
  - a job token with `permissions: contents: write` when upload_to_release is
    true: the upload POSTs to the release.

inputs:
  artifact_name_suffix:
    description: "Suffix for the workflow artifact name (e.g., the ref or SHA)"
    default: ""
    required: false
  asset_name:
    description: "File name the SBOM is attached to the release under"
    default: "sbom.spdx.json"
    required: false
  exclude:
    description: |
      Newline-separated Syft exclude globs, one per line. Each must start with
      ./, */ or **/, or Syft rejects it. Use this for paths a package manager
      installs into the checkout that carry dependencies of their own, such as
      a Ruby bundle holding gems that ship their own JavaScript lock files.
    default: ""
    required: false
  path:
    description: "Directory scanned for dependencies"
    default: "."
    required: false
  release_tag:
    description: "Tag whose release receives the upload. Defaults to the pushed tag"
    default: ""
    required: false
  upload_as_artifact:
    description: "Upload the SBOM as a workflow artifact"
    default: "false"
    required: false
  upload_to_release:
    description: "Upload the SBOM to the GitHub Release (requires an existing release; pass release_tag on a dispatched run)"
    default: "false"
    required: false

runs:
  using: "composite"

  steps:
    - name: Build Syft config
      id: syft-config
      env:
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        config="${RUNNER_TEMP}/syft.yaml"

        # Syft reads the workflow files in the checkout and catalogues every
        # action they reference as a component. Those run on the build machine
        # and are not shipped, so they do not belong in a release SBOM. One tag
        # covers both GitHub Actions catalogers.
        printf 'select-catalogers:\n  - "-github-actions"\n' > "$config"

        if [ -n "$(printf '%s' "$EXCLUDE" | tr -d '[:space:]')" ]; then
          printf 'exclude:\n' >> "$config"
          printf '%s\n' "$EXCLUDE" | while IFS= read -r pattern; do
            if [ -n "$pattern" ]; then
              printf '  - "%s"\n' "$pattern" >> "$config"
            fi
          done
        fi

        echo "path=$config" >> "$GITHUB_OUTPUT"
        echo "::group::Syft config"
        cat "$config"
        echo "::endgroup::"
      shell: bash

    # upload-release-assets is off because this action owns the upload: the
    # built-in one fires only on a tag push, which is the gap being closed.
    - name: Generate SBOM
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        path: ${{ inputs.path }}
        config: ${{ steps.syft-config.outputs.path }}
        format: spdx-json
        output-file: ${{ runner.temp }}/${{ inputs.asset_name }}
        upload-artifact: "false"
        upload-release-assets: "false"

    - name: Verify SBOM
      env:
        SBOM_PATH: ${{ runner.temp }}/${{ inputs.asset_name }}
      run: |
        if [ ! -s "$SBOM_PATH" ]; then
          echo "::error::SBOM is empty or missing"
          exit 1
        fi
        echo "::group::SBOM stats"
        wc -c "$SBOM_PATH"
        python3 "$GITHUB_ACTION_PATH/verify_sbom.py"
        echo "::endgroup::"
        echo "✅ SBOM generated successfully"
      shell: bash

    - name: Upload as workflow artifact
      if: ${{ inputs.upload_as_artifact == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: sbom-${{ inputs.artifact_name_suffix || github.sha }}
        path: ${{ runner.temp }}/${{ inputs.asset_name }}

    - name: Upload to GitHub Release
      if: ${{ inputs.upload_to_release == 'true' }}
      env:
        ASSET_PATH: ${{ runner.temp }}/${{ inputs.asset_name }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REF: ${{ github.ref }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: python3 "$GITHUB_ACTION_PATH/../lib/release_assets.py"
      shell: bash
