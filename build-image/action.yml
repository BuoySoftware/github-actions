name: Build docker image
description: This action builds a docker image and pushes it to AWS ECR.

inputs:
  aws_access_key_id:
    description: AWS ECR access key id
    required: true
  aws_secret_access_key:
    description: AWS ECR secret access key
    required: true
  base_image:
    default: ""
    description: Full image reference passed to the docker build as --build-arg BASE_IMAGE. Only has an effect when the Dockerfile declares ARG BASE_IMAGE before its first FROM. Requires tag_suffix, so the resulting image cannot collide with a default-base build of the same commit.
    required: false
  builder_image:
    default: ""
    description: Full image reference passed to the docker build as --build-arg BUILDER_IMAGE, for Dockerfiles whose builder stage uses a separate base. Only has an effect when the Dockerfile declares ARG BUILDER_IMAGE before its first FROM, which is verified independently of base_image. Same requirements as base_image otherwise.
    required: false
  build_args:
    description: Additional docker build args
  ecr_repository:
    description: ECR repo to push image
    required: false
  release_candidate_tag:
    description: When provided, the platform version (e.g. v29.0) will be attached to this release candidate tag (e.g. v29.0-rc.3) found in AWS ECR.
    required: false
  security_patch:
    default: "false"
    description: When true, signify that the build is a security patch
    required: false
  slack_webhook_url:
    description: Slack webhook URL for notifications
    required: false
  tag_suffix:
    default: ""
    description: Appended verbatim to the short and long SHA tags, and to the release ref tag when one applies (include any leading "-"). Applied after the security_patch date suffix when both are set. Skip-if-exists inspects the composed (suffixed) tag, so a rerun is a no-op and an unsuffixed image of the same commit does not cause a skip.
    required: false

outputs:
  long_sha_tag:
    description: "Long SHA tag assigned to the image"
    value: ${{ steps.current-git-details.outputs.long }}
  ref_tag:
    description: "Ref tag assigned to the image (for git tags)"
    value: ${{ steps.current-git-details.outputs.tag }}
  registry:
    description: "ECR registry for the image"
    value: ${{ steps.login-ecr.outputs.registry }}
  sha:
    description: "Commit tag without build suffixes (sha-<40hex>)"
    value: ${{ steps.current-git-details.outputs.sha }}
  short_sha_tag:
    description: "Short SHA tag assigned to the image"
    value: ${{ steps.current-git-details.outputs.short }}

runs:
  using: "composite"

  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Read current git details
      id: current-git-details
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base_image }}
        BUILDER_IMAGE: ${{ inputs.builder_image }}
        RELEASE_CANDIDATE_TAG: ${{ inputs.release_candidate_tag }}
        SECURITY_PATCH: ${{ inputs.security_patch }}
        TAG_SUFFIX: ${{ inputs.tag_suffix }}
        DISPATCH_REF: ${{ github.event.inputs.ref }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        ref_tag=""
        if [ -n "$DISPATCH_REF" ] &&
          git show-ref --verify "refs/tags/$DISPATCH_REF" > /dev/null 2>&1; then
          ref_tag="tag-$DISPATCH_REF"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          ref_tag="tag-$GITHUB_REF_NAME"
        fi

        GIT_SHA="$(git rev-parse HEAD)" \
        GIT_SHORT_SHA="$(git rev-parse --short HEAD)" \
        REF_TAG="$ref_tag" \
          "${{ github.action_path }}/compose-tags.sh" >> "$GITHUB_OUTPUT"

    - name: Summarize tags
      shell: bash
      env:
        SHORT: ${{ steps.current-git-details.outputs.short }}
        LONG: ${{ steps.current-git-details.outputs.long }}
        REF_TAG: ${{ steps.current-git-details.outputs.tag }}
        BASE_IMAGE: ${{ inputs.base_image }}
        BUILDER_IMAGE: ${{ inputs.builder_image }}
      run: |
        {
          echo "## Tags"
          echo "Short SHA: $SHORT"
          echo "Long SHA: $LONG"
          echo "Ref Tag: $REF_TAG"
          if [ -n "$BASE_IMAGE" ] || [ -n "$BUILDER_IMAGE" ]; then
            echo "Base image: ${BASE_IMAGE:-(default)}"
            echo "Builder image: ${BUILDER_IMAGE:-(default)}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Configure Amazon ECR Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Check if the image already exists
      id: check-image-exists
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base_image }}
        BUILDER_IMAGE: ${{ inputs.builder_image }}
        RC_TAG: ${{ inputs.release_candidate_tag && format('tag-{0}', inputs.release_candidate_tag) || '' }}
        REF_TAG: ${{ steps.current-git-details.outputs.tag }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ inputs.ecr_repository }}
        SECURITY_PATCH: ${{ inputs.security_patch }}
        SHORT_SHA_TAG: ${{ steps.current-git-details.outputs.short }}
      run: |
        echo "## Build Details" >> $GITHUB_STEP_SUMMARY
        echo "Base image: ${BASE_IMAGE:-<dockerfile default>}" >> "$GITHUB_STEP_SUMMARY"
        echo "Builder image: ${BUILDER_IMAGE:-<dockerfile default>}" >> "$GITHUB_STEP_SUMMARY"

        if [[ -n "$RC_TAG" && -n "$REF_TAG" ]]; then
          echo "Tagging platform version $REF_TAG to the RC image $RC_TAG." >> $GITHUB_STEP_SUMMARY
          docker pull $REGISTRY/$REPOSITORY:$RC_TAG
          docker tag $REGISTRY/$REPOSITORY:$RC_TAG $REGISTRY/$REPOSITORY:$REF_TAG
          docker push $REGISTRY/$REPOSITORY:$REF_TAG
          echo "image_exists=true" >> $GITHUB_OUTPUT
        else
          SHORT_SHA_TAG_EXISTS=""
          if [[ "$SECURITY_PATCH" != "true" ]]; then
            SHORT_SHA_TAG_EXISTS=$(docker manifest inspect $REGISTRY/$REPOSITORY:$SHORT_SHA_TAG > /dev/null 2>&1 && echo yes || echo no)
          fi
          decision=$(SHORT_SHA_TAG_EXISTS="$SHORT_SHA_TAG_EXISTS" \
            "${{ github.action_path }}/decide-image-exists.sh")
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [[ "$SECURITY_PATCH" == "true" ]]; then
            echo "Security patch build, proceeding with build step" >> $GITHUB_STEP_SUMMARY
          elif [[ "$decision" == "image_exists=true" ]]; then
            echo "Image already exists, skipping build step" >> $GITHUB_STEP_SUMMARY
          else
            echo "Image not found, proceeding with build step" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Build, tag, and push docker image to Amazon ECR
      if: steps.check-image-exists.outputs.image_exists == 'false'
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base_image }}
        BUILDER_IMAGE: ${{ inputs.builder_image }}
        BUILD_ARGS: ${{ inputs.build_args }}
        LONG_SHA_TAG: ${{ steps.current-git-details.outputs.long }}
        REF_TAG: ${{ steps.current-git-details.outputs.tag }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ inputs.ecr_repository }}
        SECURITY_PATCH: ${{ inputs.security_patch }}
        SHORT_SHA_TAG: ${{ steps.current-git-details.outputs.short }}
        # The raw commit, not a tag: this is baked into the image as its own
        # identity, and tag suffixes would break exact-match lookups on it.
        SHA: ${{ steps.current-git-details.outputs.sha }}
      run: |
        TAGS="-t $REGISTRY/$REPOSITORY:$SHORT_SHA_TAG -t $REGISTRY/$REPOSITORY:$LONG_SHA_TAG"
        if [ -n "$REF_TAG" ]; then
          TAGS="$TAGS -t $REGISTRY/$REPOSITORY:$REF_TAG"
        fi

        BASE_ARGS=""
        if [ -n "$BASE_IMAGE" ]; then
          BASE_ARGS="$BASE_ARGS --build-arg BASE_IMAGE=$BASE_IMAGE"
        fi
        if [ -n "$BUILDER_IMAGE" ]; then
          BASE_ARGS="$BASE_ARGS --build-arg BUILDER_IMAGE=$BUILDER_IMAGE"
        fi

        docker build . $TAGS $BUILD_ARGS $BASE_ARGS --build-arg CURR_GIT_SHA="$SHA"
        docker push --all-tags $REGISTRY/$REPOSITORY

    - name: Notify Slack on failure
      if: failure() && inputs.slack_webhook_url != ''
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
        AS_REF: ${{ github.ref }}
        AS_AUTHOR: ${{ github.actor }}
      with:
        status: custom
        fields: workflow,job,commit,repo,ref,author,took
        custom_payload: |
          {
            "attachments": [{
              "color": "danger",
              "mrkdwn_in": ["text"],
              "text": ":x: *Docker build failed*\n*Ref:* ${{ env.AS_REF }}\n*Author:* ${{ env.AS_AUTHOR }}\n\nPlease check the CI job logs for details: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }]
          }
