name: Create release
description: |
  Creates the GitHub release for a pushed version tag with a correct identity:
  release notes generated from the right lower boundary, the prerelease flag
  derived from the tag itself, and the "Latest" flag always stated explicitly.

  When the release already exists -- because a tag push raced another job, or
  because someone cut it by hand -- the release is left in place and its
  prerelease and "Latest" flags are corrected instead. The correction is scoped
  to those two fields, so notes, title and target survive it, as do any assets
  already attached.

  Release identity is derived entirely from the repository's tag list. Nothing
  else about the release depends on the caller, and there is no input to
  override the flags: two callers reading the same tag would otherwise publish
  contradictory releases.

  Prerequisites (caller must provide):
  - A tag push. The pushed tag is read from github.ref_name.
  - A token with permission to list tags and to create and edit releases.

  No checkout, database, language runtime or dependency install is needed: the
  action reads the tag list over the API and calls the release API. Keeping that
  failure surface small is what makes it safe to gate other jobs on this one.

  A version tag carries two or three dot-separated numbers, optionally followed
  by a release-candidate ordinal (`-rc.4` or `-rc4`) and optionally by a trailing
  suffix. The numbers are ranked left to right, and nothing here depends on what
  a repository calls them, so the two-part and three-part schemes both in use are
  ordered correctly.

  An absent third number counts as zero, so `v2.2` and `v2.2.0` are one version.
  Trailing suffixes carry no ordering information. The leading `v` is required,
  which keeps a retired all-digit tag scheme from being read as very high
  versions.

inputs:
  token:
    description: "Token with permission to create and edit releases"
    required: true

outputs:
  latest:
    description: "Whether this release was published as Latest"
    value: ${{ steps.identity.outputs.latest }}
  notes_start:
    description: "Tag the release notes were generated from, empty if none applied"
    value: ${{ steps.identity.outputs.notes_start }}
  prerelease:
    description: "Whether the pushed tag is a release candidate"
    value: ${{ steps.identity.outputs.prerelease }}

runs:
  using: "composite"

  steps:
    - name: Resolve release identity
      id: identity
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MAX_PAGES: "20"
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        # A version's identity is its dot-separated numbers plus a
        # release-candidate ordinal. The numbers are held by position rather than
        # by name, because what each position means differs between repositories
        # while the ranking does not. `rc` is -1 for a final release so that
        # finals sort above every candidate of the same version. Anything after
        # the ordinal is a collision-avoidance suffix and takes no part in
        # ordering.
        #
        # The leading `v` is required. It is what separates the current scheme
        # from the retired `YYYYMMDD.N` one, whose tags parse as versions with a
        # leading number in the millions and would outrank every real release.
        #
        # Emits "<first> <second> <third> <rc>" for a version tag, nothing for a
        # tag that is not one.
        parse_tag() {
          local tag="$1"
          [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?(-rc\.?([0-9]+))?(-[A-Za-z0-9_.-]+)?$ ]] || return 1
          local first="${BASH_REMATCH[1]}" second="${BASH_REMATCH[2]}"
          local third="${BASH_REMATCH[4]:-0}" rc="${BASH_REMATCH[6]:-}"
          # A tag with no ordinal is a final. -1 keeps it above its candidates
          # without a special case at every comparison.
          printf '%s %s %s %s\n' "$first" "$second" "$third" "${rc:--1}"
        }

        # Zero-padded so a plain lexical sort orders the tuple numerically, which
        # keeps the whole comparison inside `sort` rather than in shell loops.
        # A final's -1 ordinal maps to a high rank so it sorts above every
        # candidate of the same version rather than below them.
        sort_key() {
          local rank="$4"
          if [ "$rank" -lt 0 ]; then
            rank=9999999999
          fi
          printf '%010d.%010d.%010d.%010d' "$1" "$2" "$3" "$rank"
        }

        pushed_fields=$(parse_tag "$TAG") || {
          echo "::error::$TAG is not a version tag; expected two or three" \
            "dot-separated numbers, as v1.2 or v1.2.3, optionally followed by" \
            "-rc<n> and a suffix"
          exit 1
        }
        # shellcheck disable=SC2086  # deliberate word splitting of the fields
        set -- $pushed_fields
        pushed_first="$1" pushed_second="$2" pushed_third="$3" pushed_rc="$4"
        pushed_key=$(sort_key "$pushed_first" "$pushed_second" "$pushed_third" "$pushed_rc")
        pushed_version=$(sort_key "$pushed_first" "$pushed_second" "$pushed_third" 0)

        # Tags come from the API, so the action needs no checkout. Identity is
        # decided by comparing the pushed tag against others, and a shallow
        # checkout would narrow that comparison into a plausible wrong answer
        # with nothing to detect it.
        #
        # Every version tag is a candidate boundary, including test and personal
        # ones: excluding those would make the notes base depend on who cut the
        # surrounding tags.
        #
        # Ordering comes from the parsed tuple, never from the order the API
        # returns, which is not version order -- it places a version's final
        # after its own candidates, and sorts v100 above v99 while ranking a
        # retired scheme above both. Tag dates are not consulted either, since
        # tags are routinely cut out of chronological order, nor is commit
        # ancestry: most release tags are unreachable from the default branch.
        #
        # Paging stops after the page on which a version strictly below the
        # pushed tag's first appears. The notes base is either in the pushed
        # tag's own version or in the highest one below it, and the listing is
        # ordered newest-first, so a page containing a lower version bounds
        # anything a later page could contribute. The whole page is consumed
        # before stopping rather than only up to the first lower tag, because the
        # order within a page is the API's and not a version ranking.
        page=1
        seen=""
        lower_seen=false
        while [ "$page" -le "$MAX_PAGES" ]; do
          body=$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100&page=$page" \
            --jq '.[].name') || {
            echo "::error::Could not list tags for $GITHUB_REPOSITORY (page $page)"
            exit 1
          }
          if [ -z "$body" ]; then
            # The listing ran out. Whatever is below the pushed tag, if anything,
            # has been seen.
            lower_seen=true
            break
          fi

          while read -r tag; do
            [ -z "$tag" ] && continue
            fields=$(parse_tag "$tag") || continue
            # shellcheck disable=SC2086  # deliberate word splitting of the tuple
            set -- $fields
            seen+="$(sort_key "$1" "$2" "$3" "$4") $(sort_key "$1" "$2" "$3" 0) $4 $tag"$'\n'
          done <<< "$body"

          # `NF` guards the blank line the accumulated list ends with, whose
          # unset field would compare below every version and stop paging on the
          # first page.
          if awk -v version="$pushed_version" \
            'NF && $2 < version { found = 1 } END { exit !found }' <<< "$seen"; then
            lower_seen=true
            break
          fi
          page=$((page + 1))
        done

        if [ "$lower_seen" != "true" ]; then
          echo "::error::Reached the $MAX_PAGES-page tag listing limit for" \
            "$GITHUB_REPOSITORY without finding a version below $TAG." \
            "Refusing to pick a notes base from a partial tag list."
          exit 1
        fi

        candidates=$(sort <<< "$seen" | sed '/^$/d')

        # The tag from the last row of `candidates` satisfying the awk condition,
        # empty when none does. Rows are in ascending version order, so the last
        # match is the highest. Conditions are single-quoted: `$2` and `$3` in
        # them are awk fields, and `version` and `key` are awk variables bound
        # here for the condition to compare against.
        highest_where() {
          local condition="$1" version="$2" key="${3:-}"
          awk -v version="$version" -v key="$key" \
            "($condition) { t = \$4 } END { print t }" <<< "$candidates"
        }

        # 1. The highest candidate below the pushed tag within its own version.
        #    Each candidate then documents only what changed since the last one.
        notes_start=$(
          highest_where '$2 == version && $1 < key && $3 >= 0' "$pushed_version" "$pushed_key"
        )

        if [ -z "$notes_start" ]; then
          # 2. Nothing below it in its own version, so reach back to the highest
          #    version below and use that version's published boundary: its
          #    final when the final names the same commit as its last candidate,
          #    otherwise that candidate. A final cut before the version's last
          #    candidate sits behind it, and basing on it would re-describe
          #    everything those later candidates already covered.
          lower_version=$(
            awk -v version="$pushed_version" '$2 < version { l = $2 } END { print l }' <<< "$candidates"
          )

          if [ -n "$lower_version" ]; then
            # The version's highest candidate and its final are compared by the
            # commit each names, not by version: a final always outranks its own
            # candidates, so ranking alone cannot tell a published boundary from
            # one cut before the version finished.
            lower_version_candidate=$(highest_where '$2 == version && $3 >= 0' "$lower_version")
            lower_version_final=$(highest_where '$2 == version && $3 < 0' "$lower_version")

            if [ -z "$lower_version_candidate" ]; then
              notes_start="$lower_version_final"
            elif [ -z "$lower_version_final" ]; then
              notes_start="$lower_version_candidate"
            else
              final_commit=$(git rev-list -n 1 "$lower_version_final" 2>/dev/null || true)
              candidate_commit=$(git rev-list -n 1 "$lower_version_candidate" 2>/dev/null || true)
              if [ -n "$final_commit" ] && [ "$final_commit" == "$candidate_commit" ]; then
                notes_start="$lower_version_final"
              else
                notes_start="$lower_version_candidate"
              fi
            fi
          fi
          # 3. No lower version at all. `notes_start` stays empty and the create
          #    step omits the boundary rather than passing an empty one, which
          #    would generate notes from the entire history.
        fi

        # A release candidate, and only a release candidate, is a prerelease. The
        # pattern is anchored and requires a numeric ordinal: a branch-name
        # suffix that merely contains "rc" is not a candidate.
        if [ "$pushed_rc" -ge 0 ]; then
          prerelease=true
        else
          prerelease=false
        fi

        # "Latest" is publish-order by default, which is what put an older
        # release under it. A final claims it only when no final sorts above the
        # pushed tag; candidates never claim it.
        latest=false
        if [ "$prerelease" == "false" ]; then
          higher_final=$(highest_where '$1 > key && $3 < 0' "" "$pushed_key")
          if [ -z "$higher_final" ]; then
            latest=true
          fi
        fi

        {
          echo "latest=$latest"
          echo "notes_start=$notes_start"
          echo "prerelease=$prerelease"
        } >> "$GITHUB_OUTPUT"

        echo "$TAG: prerelease=$prerelease latest=$latest notes base=${notes_start:-<none>}"
      shell: bash

    - name: Create or update release
      env:
        GH_TOKEN: ${{ inputs.token }}
        LATEST: ${{ steps.identity.outputs.latest }}
        NOTES_START: ${{ steps.identity.outputs.notes_start }}
        PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        # Both flags are stated on every call. `--latest` is three-state on the
        # release API: omitting it is not the same as declining it, and the
        # fallback is publish order.
        FLAGS=(--prerelease="$PRERELEASE" --latest="$LATEST")

        # Correcting an existing release with a call that also names the tag is
        # rejected as `already_exists`, and the rejection takes any attached
        # asset with it. Editing the flags as named fields leaves the rest of the
        # release -- notes, title, target, assets -- alone.
        reconcile() {
          if ! gh release edit "$TAG" "${FLAGS[@]}"; then
            echo "::error::Could not correct the release flags on $TAG"
            return 1
          fi
          echo "Corrected $TAG: prerelease=$PRERELEASE latest=$LATEST"
        }

        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists; correcting its flags"
          reconcile
          exit $?
        fi

        NOTES=(--generate-notes)
        # An empty boundary is not the same as no boundary: it would widen the
        # notes to the entire history.
        [ -n "$NOTES_START" ] && NOTES+=(--notes-start-tag "$NOTES_START")

        if CREATE_OUTPUT=$(gh release create "$TAG" --title "$TAG" \
          "${NOTES[@]}" "${FLAGS[@]}" 2>&1); then
          echo "Created release $TAG: prerelease=$PRERELEASE latest=$LATEST" \
            "notes base=${NOTES_START:-<none>}"
          exit 0
        fi

        # Another job pushing the same tag may have won the race. Its release is
        # the one this run wanted, so reconcile the flags onto it rather than
        # failing.
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG appeared concurrently; correcting its flags"
          reconcile
          exit $?
        fi

        echo "::error::Could not create release $TAG: $CREATE_OUTPUT"
        exit 1
      shell: bash
